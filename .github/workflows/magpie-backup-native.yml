name: Magpie immutable backup retention qualification
on:
  push:
    branches: [qualification/magpie-backup-native-20261013]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    if: github.repository == 'rudycelekli/magpie' && !github.event.repository.private && github.event.repository.fork == true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        phase: [baseline, fixed]
        include:
          - os: ubuntu-latest
            osname: Linux
          - os: macos-latest
            osname: macOS
          - os: windows-latest
            osname: Windows
          - phase: baseline
            head: 1133ca0fe21fcf86f57d5c12612d8d9e691bec85
          - phase: fixed
            head: 9f31dffd329ff42443840c5ba37a5289def41ed9
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - name: Preserve exact checkout bytes
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.head }}
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Native Linux compile dependencies (upstream GTK3 backend)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p 'proof/${{ matrix.osname }}-${{ matrix.phase }}'
          sudo apt-get update > 'proof/${{ matrix.osname }}-${{ matrix.phase }}/dependency-install.log' 2>&1
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev >> 'proof/${{ matrix.osname }}-${{ matrix.phase }}/dependency-install.log' 2>&1
      - name: Native qualification (Unix)
        if: runner.os != 'Windows'
        run: python3 harness/qualification/native.py '${{ matrix.phase }}' source 'proof/${{ matrix.osname }}-${{ matrix.phase }}'
      - name: Native qualification (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python harness/qualification/native.py '${{ matrix.phase }}' source 'proof/${{ matrix.osname }}-${{ matrix.phase }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: magpie-${{ matrix.osname }}-${{ matrix.phase }}
          path: proof/${{ matrix.osname }}-${{ matrix.phase }}/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
  compare:
    needs: native
    if: always() && github.repository == 'rudycelekli/magpie' && !github.event.repository.private && github.event.repository.fork == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download raw native receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download '${{ github.run_id }}' --repo '${{ github.repository }}' --dir artifacts
      - name: Evaluator controls
        run: |
          python3 -m unittest discover -s qualification -p 'test_*.py' -v > evaluator-controls.log 2>&1
          cat evaluator-controls.log
      - name: Compare pristine originals and literal regressions
        run: python3 qualification/compare.py artifacts comparison.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: magpie-backup-comparison
          path: |
            comparison.json
            evaluator-controls.log
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
